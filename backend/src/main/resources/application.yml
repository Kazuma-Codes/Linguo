server:
  port: ${PORT:8000}


spring:
  application:
    name: linguo-backend
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL}}
    username: ${POSTGRES_USER:}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  data:
    redis:
      url: ${REDIS_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
        add-additional-paths: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  jwt:
    secret: ${SECRET_KEY}
    expiration-minutes: ${ACCESS_TOKEN_EXPIRE_MINUTES:10080}
  groq:
    api-key: ${GROQ_API_KEY}
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    model: ${GROQ_MODEL:openai/gpt-oss-20b}
    backup-model: ${GROQ_BACKUP_MODEL:qwen/qwen3.8-27b}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}
