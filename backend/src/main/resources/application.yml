server:
  port: ${PORT:8000}


spring:
  config:
    # ponytail: .env read depends on CWD=backend/ (README's `cd backend && mvn`) and plain KEY=VAL only.
    # upgrade path: real env vars or spring-dotenv when deploying from another directory / .env gains quotes.
    # running from repo root? append a 2nd line: - optional:file:backend/.env[.properties]
    import: optional:file:.env[.properties]
  application:
    name: mosaic-backend
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL}}
    username: ${DATABASE_USERNAME:${POSTGRES_USER:}}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate

  data:
    redis:
      url: ${REDIS_URL}
      repositories:
        enabled: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

logging:
  level:
    root: INFO
    com.mosaic: INFO
    com.zaxxer.hikari: INFO
    org.postgresql: INFO
    org.springframework.web: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
        add-additional-paths: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  jwt:
    secret: ${SECRET_KEY}
    expiration-minutes: ${ACCESS_TOKEN_EXPIRE_MINUTES:60}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    android-client-id: ${GOOGLE_ANDROID_CLIENT_ID:}
  # Groq Cloud AI configuration with multi-key and multi-model fallback
  groq:
    api-keys: ${GROQ_API_KEYS:${GROQ_API_KEY:}}
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    model: ${GROQ_MODEL:openai/gpt-oss-20b}
    backup-model: ${GROQ_BACKUP_MODEL:openai/gpt-oss-120b}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:8081}
